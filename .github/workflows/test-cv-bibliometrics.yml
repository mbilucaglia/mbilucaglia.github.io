name: Test CV bibliometrics

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/generate_cv_bibliometrics.py'
      - 'scripts/test_generate_cv_bibliometrics.py'
      - '.github/workflows/test-cv-bibliometrics.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/auto-bibliometrics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Unit tests
        run: python -m unittest discover -s scripts -p 'test_generate_cv_bibliometrics.py' -v
      - name: Checkout CV read-only
        uses: actions/checkout@v4
        with:
          repository: mbilucaglia/MyCV
          ref: main
          path: mycv-source
          token: ${{ secrets.BIBLIOGRAPHY_ACCESS_TOKEN }}
          persist-credentials: false
      - name: Test actual Scholar data
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INSTTOKEN: ${{ secrets.ELSEVIER_INSTTOKEN }}
        run: |
          cp mycv-source/bibliographic_indices.tex "$RUNNER_TEMP/original.tex"
          python scripts/generate_cv_bibliometrics.py --cv mycv-source/bibliographic_indices.tex
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import generate_cv_bibliometrics as updater
          original = (Path(os.environ["RUNNER_TEMP"]) / "original.tex").read_text()
          actual = Path("mycv-source/bibliographic_indices.tex").read_text()
          expected = updater.replace_section(original, "Google Scholar", updater.scholar(Path("_data/scholar.json")))
          assert actual.split(r"\subsection*{Scopus}")[0] == expected.split(r"\subsection*{Scopus}")[0]
          assert actual.split(r"\subsection*{Web of Science}")[1] == original.split(r"\subsection*{Web of Science}")[1]
          assert actual.split(r"\subsection*{Scopus}")[1] == original.split(r"\subsection*{Scopus}")[1]
          print("Scholar integration and unchanged Scopus/WoS sections verified")
          PY
      - name: Compile temporary CV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk biber texlive-latex-extra texlive-bibtex-extra texlive-fonts-recommended texlive-science
          cd mycv-source
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          test -s main.pdf
