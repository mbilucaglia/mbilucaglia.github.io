short_bio: "I am a bioengineer at the [Behavior and Brain Lab IULM – Neuromarketing Research Center](https://en.brainlabiulm.com/) at Università IULM. My work spans experimental design, physiological data acquisition, multimodal synchronization, signal processing, and machine learning, primarily applied to consumer neuroscience, affective neuroscience, and human performance."
