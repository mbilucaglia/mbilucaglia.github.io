short_bio: "I am a bioengineer at the [Behavior and Brain Lab IULM – Neuromarketing Research Center](https://en.brainlabiulm.com/) at [Università IULM](https://www.iulm.it/en/home/). I work across the full lifecycle of biosignals, from experimental design and data recording to signal processing and statistical modelling, extending to data validation and scientific writing. My research interests include Digital Signal Processing and Machine Learning, with applications in consumer neuroscience and human performance.
