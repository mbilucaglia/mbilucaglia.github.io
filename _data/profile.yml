short_bio: "I am a bioengineer at the [Behaviour and Brain Lab IULM - Neuromarketing Research Center](https://en.brainlabiulm.com/) at [Università IULM](https://www.iulm.it/en/home). My work spans the experimental lifecycle of psychophysiological and neurophysiological data, from study design and multimodal acquisition and synchronization to signal processing, statistical analysis, machine-learning modelling, data visualisation, and interpretation. My research focuses on digital signal processing and machine learning applied to neurophysiological data, with applications in consumer and affective neuroscience, neuromarketing, and human performance."
research_interests:
  - name: "Biomedical Signal Processing"
    description: "EEG and multimodal physiological-signal processing, including ERP and spectral analysis, robust quantification, and evaluation of signal-processing methods."
  - name: "Machine Learning for Neurophysiological Data"
    description: "Feature engineering, classification and regression of EEG and multimodal biosignals, with emphasis on validation, robustness, and interpretable prediction."
  - name: "Consumer & Affective Neuroscience"
    description: "Neurophysiological and behavioural measurement of emotion, engagement, preference, and decision processes in consumer and communication contexts."
  - name: "Human Performance & Neuroergonomics"
    description: "EEG, skin conductance, cardiac, and eye-tracking measures of attention, workload, stress, interpersonal synchrony, and performance."
