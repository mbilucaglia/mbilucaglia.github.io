short_bio: "I am Bioengineer at the [Behaviour and Brain Lab IULM - Neuromarketing Research Center](https://en.brainlabiulm.com/) and former Ph.D. Fellow at [Università IULM](https://www.iulm.it/en/home). My work spans the full lifecycle of physiological signals in experimental research, primarily in Consumer Neuroscience and Neuromarketing, from data acquisition and multimodal synchronization to signal processing and data classification."
